<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GridSight — Energy Demand Forecasting</title>
<meta name="description" content="GridSight dashboard: next-24h demand forecast with uncertainty band, alerts, battery plan, accuracy and assistant. Advisory only.">
<meta property="og:title" content="GridSight — Energy Demand Forecasting">
<meta property="og:description" content="Next-24h demand forecast with P10–P90 band, peak alerts, battery plan and an assistant. Advisory only.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2322d3ee'/%3E%3Cpath fill='%230a0d2c' d='M13 3.5 5 14h4.6L8.5 20.5 19 10h-6l1-6.5z'/%3E%3C/svg%3E">
<meta name="theme-color" content="#0d1033">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&f[]=satoshi@300,400,500,700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="aurora" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>
    </span>
    <div class="brand-text">
      <h1>GridSight</h1>
      <p>Short-term energy demand forecasting</p>
    </div>
  </div>

  <span class="badge advisory" title="Forecasts and plans are recommendations. Nothing is executed automatically.">
    <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="M12 3 5 6v5c0 4.5 3 8 7 10 4-2 7-5.5 7-10V6l-7-3z"/><path fill="none" stroke="currentColor" stroke-width="2" d="m9 12 2 2 4-4"/></svg>
    Advisory only
  </span>

  <div class="topbar-controls">
    <label class="field">
      <span class="field-label" id="runLabel">Run</span>
      <select id="runSelect" aria-labelledby="runLabel"></select>
    </label>
    <label class="field">
      <span class="field-label" id="levelLabel">Level</span>
      <select id="levelSelect" aria-labelledby="levelLabel">
        <option value="portfolio">Portfolio</option>
        <option value="zone">Zone</option>
        <option value="house">House</option>
      </select>
    </label>
    <label class="field">
      <span class="field-label" id="entityLabel">Entity</span>
      <select id="entitySelect" aria-labelledby="entityLabel"></select>
    </label>
    <button id="refreshBtn" class="icon-btn" type="button" aria-label="Refresh data" title="Refresh data">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 12a8 8 0 0 1 14.2-5M20 12a8 8 0 0 1-14.2 5"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M18.5 3.5v3.5h-3.5M5.5 20.5V17h3.5"/></svg>
    </button>
  </div>
</header>

<nav class="tabs" aria-label="Dashboard sections">
  <div class="tabs-scroll" role="tablist">
    <button class="tab active" role="tab" id="tab-overview" data-tab="overview" aria-selected="true" aria-controls="panel-overview" type="button">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M3 12h4l3-8 4 16 3-8h4"/></svg>
      Overview
    </button>
    <button class="tab" role="tab" id="tab-granularity" data-tab="granularity" aria-selected="false" aria-controls="panel-granularity" type="button" tabindex="-1">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="m12 3 9 5-9 5-9-5 9-5zm0 9.5 6.5 3.7M3 12.5l9 5 4.2-2.4"/></svg>
      Granularity
    </button>
    <button class="tab" role="tab" id="tab-alerts" data-tab="alerts" aria-selected="false" aria-controls="panel-alerts" type="button" tabindex="-1">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="M12 4a6 6 0 0 0-6 6v3.5L4 17h16l-2-3.5V10a6 6 0 0 0-6-6zM9.5 20a2.5 2.5 0 0 0 5 0"/></svg>
      Alerts
      <span class="tab-count" id="alertsCount" hidden>0</span>
    </button>
    <button class="tab" role="tab" id="tab-optimizer" data-tab="optimizer" aria-selected="false" aria-controls="panel-optimizer" type="button" tabindex="-1">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><rect x="3" y="7" width="15" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M21 10v4" stroke="currentColor" stroke-width="2"/><path fill="currentColor" d="M10 8.5 6.5 12.5h2.4L8.5 15.5 12 11.5h-2.4L10 8.5z"/></svg>
      Optimizer
    </button>
    <button class="tab" role="tab" id="tab-accuracy" data-tab="accuracy" aria-selected="false" aria-controls="panel-accuracy" type="button" tabindex="-1">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>
      Accuracy
    </button>
    <button class="tab" role="tab" id="tab-assistant" data-tab="assistant" aria-selected="false" aria-controls="panel-assistant" type="button" tabindex="-1">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="M4 5h16v11H9l-5 4V5z"/><path d="M8 9.5h8M8 12.5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Assistant
    </button>
    <button class="tab" role="tab" id="tab-settings" data-tab="settings" aria-selected="false" aria-controls="panel-settings" type="button" tabindex="-1">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2-1.2L14 3h-4l-.4 2.5a7 7 0 0 0-2 1.2l-2.3-1-2 3.4 2 1.5a7 7 0 0 0 0 2.4l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2 1.2L10 21h4l.4-2.5a7 7 0 0 0 2-1.2l2.3 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg>
      Settings
    </button>
  </div>
</nav>

<main id="main">
  <section class="panel" id="panel-overview" role="tabpanel" aria-labelledby="tab-overview"></section>
  <section class="panel" id="panel-granularity" role="tabpanel" aria-labelledby="tab-granularity" hidden></section>
  <section class="panel" id="panel-alerts" role="tabpanel" aria-labelledby="tab-alerts" hidden></section>
  <section class="panel" id="panel-optimizer" role="tabpanel" aria-labelledby="tab-optimizer" hidden></section>
  <section class="panel" id="panel-accuracy" role="tabpanel" aria-labelledby="tab-accuracy" hidden></section>
  <section class="panel" id="panel-assistant" role="tabpanel" aria-labelledby="tab-assistant" hidden></section>
  <section class="panel" id="panel-settings" role="tabpanel" aria-labelledby="tab-settings" hidden></section>
</main>

<footer class="foot">
  <span id="sourceBadge" class="source-badge"></span>
  <span id="metaLine" class="foot-meta"></span>
  <span id="liveClock" class="foot-clock"></span>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="mock-data.js"></script>
<script src="api.js"></script>
<script src="charts.js"></script>
<script src="tabs/overview.js"></script>
<script src="tabs/granularity.js"></script>
<script src="tabs/alerts.js"></script>
<script src="tabs/optimizer.js"></script>
<script src="tabs/accuracy.js"></script>
<script src="tabs/assistant.js"></script>
<script src="tabs/settings.js"></script>
<script src="app.js"></script>
</body>
</html>
