# GridSight ML config (Member 1). All paths are relative to the repo root.
# On Kaggle: export GRIDSIGHT_RAW_CSV=/kaggle/input/datasets/manoharbodigi/ausgrid-com25/Ausgrid_Community_Final.csv
paths:
  raw_csv: data/raw/Ausgrid_Community_Final.csv
  processed_dir: data/processed
  runs_dir: runs
  models_dir: models
  reports_dir: reports
  docs_dir: docs
  contracts_dir: contracts/sample

# Raw CSV column names (only place the raw names appear)
raw_columns:
  timestamp: datetime
  house: Community
  zone: Cluster
  load: Load_kWh
  solar: Solar_kWh
  num_houses: Num_Houses

weather_columns: [ALLSKY_SFC_SW_DWN, CLRSKY_SFC_SW_DWN, T2M, PRECTOTCORR, QV2M, PS, WS10M, T2MWET]

time:
  tz: Australia/Sydney
  slot_minutes: 30
  kwh_to_kw: 2.0          # kWh per 30 min -> kW

weather:
  latitude: -33.87        # Sydney region, used only if the dataset weather columns are broken
  longitude: 151.21
  timezone: Australia/Sydney

data:
  max_gap_slots: 3        # gaps <= this are interpolated, longer ones stay NaN and are excluded
  outlier_mad_k: 12.0     # only counted in data_quality.json, never altered

features:
  min_history_days: 7
  holiday_state: NSW
  hot_c: 30.0             # used only for plain-language drivers
  cold_c: 12.0

model:
  seed: 42
  val_days: 14            # last days before the test window, used for early stop, blend weights, calibration
  ridge_alpha: 10.0
  quantiles: [0.1, 0.9]
  interval_coverage: 0.8
  lgbm:
    n_estimators: 400
    learning_rate: 0.06
    num_leaves: 63
    min_child_samples: 40
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 5
    reg_lambda: 0.1
    early_stopping_rounds: 30

backtest:
  n_folds: 6
  fold_days: 30
  levels: [portfolio, zone, house]
  noise: {temp_c: 2.0, radiation_w_m2: 50.0}
  seed: 42

replay:
  train_end: "2013-02-01"   # final model sees only origins before this day; null = auto (last 30 days held out)
  demo_origin: "2013-02-15T00:00"
